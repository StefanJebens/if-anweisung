<script>
/*
 * Mini-Java-Engine für Übungen zur if-Anweisung (Informatik EF)
 * ---------------------------------------------------------------
 * Prüft Schülercode (eine Teilmenge von Java: int, double, char, boolean,
 * if/else if/else, for, while, return, Zuweisungen) wie ein Compiler,
 * prüft zusätzlich die Schreibweise (Klammern, Einrückung) und führt den
 * Code mit Testwerten aus.
 *
 * Fehlerarten:
 *   parse / compile / format  -> werden den Schülern als "Syntaxfehler" gemeldet
 *   falsche Ergebnisse        -> "Semantikfehler"
 */
(function (global) {
  'use strict';

  const TYPES = new Set(['int', 'double', 'char', 'boolean']);
  const MODIFIERS = new Set(['public', 'private', 'protected', 'static']);
  const KEYWORDS = new Set([
    'abstract', 'assert', 'boolean', 'break', 'byte', 'case', 'catch', 'char', 'class', 'const', 'continue',
    'default', 'do', 'double', 'else', 'enum', 'extends', 'final', 'finally', 'float', 'for', 'goto', 'if',
    'implements', 'import', 'instanceof', 'int', 'interface', 'long', 'native', 'new', 'package', 'private',
    'protected', 'public', 'return', 'short', 'static', 'strictfp', 'super', 'switch', 'synchronized', 'this',
    'throw', 'throws', 'transient', 'try', 'void', 'volatile', 'while', 'true', 'false', 'null'
  ]);
  const ARITH = new Set(['+', '-', '*', '/', '%']);
  const REL = new Set(['<', '>', '<=', '>=']);
  const STEP_LIMIT = 200000;
  const ARITH_EX = { javaException: 'ArithmeticException' };
  const TIMEOUT_EX = { javaException: 'Timeout' };

  // ------------------------------------------------------------------
  // Fehlersammlung: Zeilennummer (0-basiert) -> Liste von Meldungen
  // ------------------------------------------------------------------
  class ErrSet {
    constructor() { this.map = new Map(); }
    add(line, msg) {
      if (line == null || line < 0) line = 0;
      if (!this.map.has(line)) this.map.set(line, []);
      const arr = this.map.get(line);
      if (!arr.includes(msg)) arr.push(msg);
    }
    get size() { return this.map.size; }
  }

  // ------------------------------------------------------------------
  // Tokenizer
  // ------------------------------------------------------------------
  const ID_START = /[\p{L}\p{Nl}_$]/u;
  const ID_PART = /[\p{L}\p{Nl}\p{Nd}\p{Mn}\p{Mc}\p{Pc}_$]/u;
  const isDigit = c => c >= '0' && c <= '9';
  const isIdStart = c => !!c && ID_START.test(c);
  const isIdPart = c => !!c && ID_PART.test(c);
  const OPS2 = new Set(['==', '!=', '<=', '>=', '&&', '||', '++', '--', '+=', '-=', '*=', '/=', '%=',
    '<<', '>>', '->', '::', '&=', '|=', '^=']);
  const OPS1 = new Set(['(', ')', '{', '}', '[', ']', ';', ',', '.', '=', '<', '>', '!', '~', '?', ':',
    '+', '-', '*', '/', '%', '&', '|', '^', '@']);
  const ESC = { n: 10, t: 9, b: 8, r: 13, f: 12, s: 32, '0': 0, "'": 39, '"': 34, '\\': 92 };

  function readNumber(s, i) {
    const n = s.length;
    let j = i, isDbl = false, bad = false;
    while (j < n && isDigit(s[j])) j++;
    if (s[j] === '.' && s[j + 1] !== '.') {
      isDbl = true; j++;
      while (j < n && isDigit(s[j])) j++;
    }
    if ((s[j] === 'e' || s[j] === 'E') &&
        (isDigit(s[j + 1]) || ((s[j + 1] === '+' || s[j + 1] === '-') && isDigit(s[j + 2])))) {
      isDbl = true; j += isDigit(s[j + 1]) ? 1 : 2;
      while (j < n && isDigit(s[j])) j++;
    }
    const text = s.slice(i, j);
    if (s[j] === 'd' || s[j] === 'D') { isDbl = true; j++; }
    else if (s[j] === 'f' || s[j] === 'F' || s[j] === 'l' || s[j] === 'L') { bad = true; j++; }
    if (isIdPart(s[j]) || s[j] === '.') {
      bad = true;
      while (j < n && (isIdPart(s[j]) || s[j] === '.')) j++;
    }
    const raw = s.slice(i, j);
    if (bad) return { t: 'err', v: raw, raw, end: j };
    if (isDbl) return { t: 'dbl', v: parseFloat(text), raw, end: j };
    if (text.length > 1 && text[0] === '0') return { t: 'err', v: raw, raw, end: j };
    const v = Number(text);
    if (v > 2147483647) return { t: 'err', v: raw, raw, end: j };
    return { t: 'int', v, raw, end: j };
  }

  function readChar(s, i) {
    const n = s.length;
    let j = i + 1, code = null;
    if (s[j] === '\\') {
      const e = s[j + 1];
      if (e === 'u') {
        let k = j + 1;
        while (s[k] === 'u') k++;
        const hex = s.substr(k, 4);
        if (/^[0-9a-fA-F]{4}$/.test(hex)) { code = parseInt(hex, 16); j = k + 4; }
      } else if (e !== undefined && Object.prototype.hasOwnProperty.call(ESC, e)) {
        code = ESC[e]; j += 2;
      }
    } else if (j < n && s[j] !== "'") {
      const cp = s.codePointAt(j);
      if (cp <= 0xFFFF) { code = cp; j += 1; }
    }
    if (code !== null && s[j] === "'") return { t: 'chr', v: code, raw: s.slice(i, j + 1), end: j + 1 };
    const k = s.indexOf("'", i + 1);
    const end = k < 0 ? n : k + 1;
    return { t: 'err', v: s.slice(i, end), raw: s.slice(i, end), end };
  }

  function readString(s, i) {
    const n = s.length;
    let j = i + 1;
    while (j < n && s[j] !== '"') { if (s[j] === '\\') j++; j++; }
    const end = Math.min(n, j + 1);
    return { t: 'str', v: s.slice(i, end), raw: s.slice(i, end), end };
  }

  /** Zerlegt alle Zeilen in Tokens (Kommentare werden entfernt). */
  function tokenize(lines) {
    let inBlock = false;
    const out = [];
    for (let ln = 0; ln < lines.length; ln++) {
      const s = String(lines[ln] == null ? '' : lines[ln]);
      const toks = [];
      const n = s.length;
      let i = 0;
      while (i < n) {
        if (inBlock) {
          const e = s.indexOf('*/', i);
          if (e < 0) { i = n; break; }
          inBlock = false; i = e + 2; continue;
        }
        const c = s[i];
        if (c === ' ' || c === '\t' || c === '\r' || c === '\f' || c === ' ') { i++; continue; }
        if (c === '/' && s[i + 1] === '/') break;
        if (c === '/' && s[i + 1] === '*') { inBlock = true; i += 2; continue; }
        const st = i;
        let tk;
        if (isIdStart(c)) {
          i++;
          while (i < n && isIdPart(s[i])) i++;
          const w = s.slice(st, i);
          tk = { t: KEYWORDS.has(w) ? 'kw' : 'id', v: w, raw: w, end: i };
        } else if (isDigit(c) || (c === '.' && isDigit(s[i + 1]))) {
          tk = readNumber(s, i);
        } else if (c === "'") {
          tk = readChar(s, i);
        } else if (c === '"') {
          tk = readString(s, i);
        } else {
          const two = s.substr(i, 2);
          if (OPS2.has(two)) tk = { t: 'op', v: two, raw: two, end: i + 2 };
          else if (OPS1.has(c)) tk = { t: 'op', v: c, raw: c, end: i + 1 };
          else tk = { t: 'err', v: c, raw: c, end: i + 1 };
        }
        tk.ln = ln;
        tk.col = st;
        i = tk.end;
        toks.push(tk);
      }
      out.push(toks);
    }
    return { lines: out, openComment: inBlock };
  }

  // ------------------------------------------------------------------
  // Logische Zeilen: der Token-Strom wird so aufgeteilt, wie er nach der
  // Schreibweise der Seite in Zeilen stehen müsste (neue Zeile nach "{",
  // nach ";" außerhalb von Klammern, "}" immer allein).
  // ------------------------------------------------------------------
  function reflow(tokLines) {
    const logical = [];
    let cur = null, depth = 0;
    const flush = () => { if (cur && cur.toks.length) logical.push(cur); cur = null; depth = 0; };
    for (const line of tokLines) {
      for (const tk of line) {
        if (tk.t === 'op' && tk.v === '}') { flush(); logical.push({ toks: [tk] }); continue; }
        if (!cur) cur = { toks: [] };
        cur.toks.push(tk);
        if (tk.t === 'op') {
          if (tk.v === '(') depth++;
          else if (tk.v === ')') depth = Math.max(0, depth - 1);
          else if (tk.v === '{') flush();
          else if (tk.v === ';' && depth === 0) flush();
        }
      }
    }
    flush();
    for (const L of logical) {
      L.phys = [...new Set(L.toks.map(t => t.ln))];
      L.home = L.toks[0].ln;
    }
    return logical;
  }

  // ------------------------------------------------------------------
  // Parser für eine logische Zeile
  // ------------------------------------------------------------------
  class PErr extends Error {}

  class P {
    constructor(toks) { this.t = toks; this.i = 0; }
    peek(o = 0) { return this.t[this.i + o]; }
    atEnd() { return this.i >= this.t.length; }
    next() {
      const tk = this.t[this.i++];
      if (!tk) throw new PErr('Zeile ist unvollständig');
      return tk;
    }
    isOp(v, o = 0) { const tk = this.peek(o); return !!tk && tk.t === 'op' && tk.v === v; }
    isKw(v, o = 0) { const tk = this.peek(o); return !!tk && tk.t === 'kw' && tk.v === v; }
    expectOp(v) {
      const tk = this.peek();
      if (!tk) throw new PErr('„' + v + '“ fehlt');
      if (tk.t !== 'op' || tk.v !== v) throw new PErr('„' + v + '“ erwartet, gefunden: „' + tk.raw + '“');
      this.i++;
      return tk;
    }
    expectId() {
      const tk = this.peek();
      if (!tk || tk.t !== 'id') throw new PErr(tk ? 'Name erwartet, gefunden: „' + tk.raw + '“' : 'Name fehlt');
      this.i++;
      return tk.v;
    }
    expectEnd() {
      if (!this.atEnd()) throw new PErr('Unerwartet: „' + this.peek().raw + '“');
    }
    // ---- Ausdrücke ----
    expr() { return this.or(); }
    or() { let l = this.and(); while (this.isOp('||')) { this.i++; l = { k: 'bin', op: '||', l, r: this.and() }; } return l; }
    and() { let l = this.eq(); while (this.isOp('&&')) { this.i++; l = { k: 'bin', op: '&&', l, r: this.eq() }; } return l; }
    eq() {
      let l = this.rel();
      while (this.isOp('==') || this.isOp('!=')) { const op = this.next().v; l = { k: 'bin', op, l, r: this.rel() }; }
      return l;
    }
    rel() {
      let l = this.add();
      while (this.isOp('<') || this.isOp('>') || this.isOp('<=') || this.isOp('>=')) {
        const op = this.next().v; l = { k: 'bin', op, l, r: this.add() };
      }
      return l;
    }
    add() {
      let l = this.mul();
      while (this.isOp('+') || this.isOp('-')) { const op = this.next().v; l = { k: 'bin', op, l, r: this.mul() }; }
      return l;
    }
    mul() {
      let l = this.unary();
      while (this.isOp('*') || this.isOp('/') || this.isOp('%')) { const op = this.next().v; l = { k: 'bin', op, l, r: this.unary() }; }
      return l;
    }
    unary() {
      if (this.isOp('-') || this.isOp('+') || this.isOp('!')) { const op = this.next().v; return { k: 'un', op, e: this.unary() }; }
      if (this.isOp('++') || this.isOp('--')) throw new PErr('++/-- innerhalb eines Ausdrucks wird hier nicht unterstützt');
      const t1 = this.peek(1);
      if (this.isOp('(') && t1 && t1.t === 'kw' && TYPES.has(t1.v) && this.isOp(')', 2)) {
        this.i += 3;
        return { k: 'cast', to: t1.v, e: this.unary() };
      }
      return this.primary();
    }
    primary() {
      const tk = this.peek();
      if (!tk) throw new PErr('Ausdruck fehlt');
      this.i++;
      if (tk.t === 'int') return { k: 'lit', ty: 'int', v: tk.v };
      if (tk.t === 'dbl') return { k: 'lit', ty: 'double', v: tk.v };
      if (tk.t === 'chr') return { k: 'lit', ty: 'char', v: tk.v };
      if (tk.t === 'kw' && (tk.v === 'true' || tk.v === 'false')) return { k: 'lit', ty: 'boolean', v: tk.v === 'true' };
      if (tk.t === 'id') {
        if (this.isOp('(') || this.isOp('.') || this.isOp('[')) throw new PErr('Methodenaufrufe und Objekte werden hier nicht verwendet');
        if (this.isOp('++') || this.isOp('--')) throw new PErr('++/-- innerhalb eines Ausdrucks wird hier nicht unterstützt');
        return { k: 'var', name: tk.v };
      }
      if (tk.t === 'op' && tk.v === '(') { const e = this.expr(); this.expectOp(')'); return e; }
      if (tk.t === 'str') throw new PErr('Zeichenketten (String) werden hier nicht verwendet');
      throw new PErr('Ausdruck erwartet, gefunden: „' + tk.raw + '“');
    }
  }

  function simpleStmt(p, full) {
    let node;
    if (p.isOp('++') || p.isOp('--')) {
      const op = p.next().v;
      node = { k: 'incdec', name: p.expectId(), op };
    } else {
      const tk = p.peek();
      if (!tk || tk.t !== 'id') throw new PErr('Anweisung erwartet');
      p.i++;
      const name = tk.v;
      const nx = p.peek();
      if (!nx) throw new PErr('Anweisung ist unvollständig');
      if (nx.t === 'op' && (nx.v === '++' || nx.v === '--')) { p.i++; node = { k: 'incdec', name, op: nx.v }; }
      else if (nx.t === 'op' && nx.v === '=') { p.i++; node = { k: 'assign', name, e: p.expr() }; }
      else if (nx.t === 'op' && ['+=', '-=', '*=', '/=', '%='].includes(nx.v)) { p.i++; node = { k: 'compound', name, op: nx.v[0], e: p.expr() }; }
      else if (nx.t === 'op' && nx.v === '(') throw new PErr('Methodenaufrufe werden hier nicht verwendet');
      else throw new PErr('Keine gültige Anweisung');
    }
    if (full) { p.expectOp(';'); p.expectEnd(); }
    return node;
  }

  /** Einzelne Anweisung ohne geschweifte Klammern (z. B. nach if (...) ). */
  function bodyStmt(p) {
    if (p.isKw('return')) {
      p.i++;
      if (p.isOp(';')) { p.i++; p.expectEnd(); return { k: 'return', e: null }; }
      const e = p.expr(); p.expectOp(';'); p.expectEnd();
      return { k: 'return', e };
    }
    if (p.isOp(';')) { p.i++; p.expectEnd(); return { k: 'empty' }; }
    const tk = p.peek();
    if (tk && (tk.t === 'id' || p.isOp('++') || p.isOp('--'))) return simpleStmt(p, true);
    throw new PErr('„{“ fehlt am Zeilenende');
  }

  /** ( Bedingung ) {   bzw.   ( Bedingung ) einzelneAnweisung; */
  function condHeader(p) {
    p.expectOp('(');
    const cond = p.expr();
    p.expectOp(')');
    if (p.isOp('{')) { p.i++; p.expectEnd(); return { cond, inline: null }; }
    if (p.atEnd()) throw new PErr('„{“ fehlt am Zeilenende');
    return { cond, inline: bodyStmt(p) };
  }

  function forHeader(p) {
    p.expectOp('(');
    let init = null, cond = null, upd = null;
    if (!p.isOp(';')) {
      const tk = p.peek();
      if (tk && tk.t === 'kw' && TYPES.has(tk.v)) { p.i++; init = declBody(p, tk.v); }
      else init = simpleStmt(p, false);
    }
    p.expectOp(';');
    if (!p.isOp(';')) cond = p.expr();
    p.expectOp(';');
    if (!p.isOp(')')) upd = simpleStmt(p, false);
    p.expectOp(')');
    if (p.isOp('{')) { p.i++; p.expectEnd(); return { k: 'for', init, cond, upd, inline: null }; }
    if (p.atEnd()) throw new PErr('„{“ fehlt am Zeilenende');
    return { k: 'for', init, cond, upd, inline: bodyStmt(p) };
  }

  function declBody(p, ty) {
    const decls = [];
    for (;;) {
      const name = p.expectId();
      let init = null;
      if (p.isOp('=')) { p.i++; init = p.expr(); }
      decls.push({ name, init });
      if (p.isOp(',')) { p.i++; continue; }
      break;
    }
    return { k: 'decl', ty, decls };
  }

  function declOrMethod(p) {
    const mods = [];
    while (p.peek() && p.peek().t === 'kw' && MODIFIERS.has(p.peek().v)) mods.push(p.next().v);
    const tyTk = p.peek();
    if (!tyTk || tyTk.t !== 'kw' || !(TYPES.has(tyTk.v) || tyTk.v === 'void')) {
      throw new PErr(tyTk ? 'Datentyp erwartet, gefunden: „' + tyTk.raw + '“' : 'Datentyp fehlt');
    }
    p.i++;
    const ty = tyTk.v;
    const nameTk = p.peek();
    if (!nameTk || nameTk.t !== 'id') throw new PErr('Name erwartet');
    if (p.isOp('(', 1)) {
      p.i += 2;
      const params = [];
      if (!p.isOp(')')) {
        for (;;) {
          const pt = p.peek();
          if (!pt || pt.t !== 'kw' || !TYPES.has(pt.v)) throw new PErr('Parametertyp erwartet');
          p.i++;
          params.push({ ty: pt.v, name: p.expectId() });
          if (p.isOp(',')) { p.i++; continue; }
          break;
        }
      }
      p.expectOp(')');
      if (p.atEnd()) throw new PErr('„{“ fehlt am Zeilenende');
      p.expectOp('{');
      p.expectEnd();
      const access = mods.filter(m => m !== 'static');
      if (access.length > 1 || new Set(mods).size !== mods.length) throw new PErr('Ungültige Modifikatoren');
      return { k: 'method', mods, ret: ty, name: nameTk.v, params };
    }
    if (mods.length) throw new PErr('Lokale Variablen haben keinen Modifikator wie public');
    if (ty === 'void') throw new PErr('void ist kein Datentyp für Variablen');
    const d = declBody(p, ty);
    p.expectOp(';');
    p.expectEnd();
    return d;
  }

  /** Parst eine logische Zeile und liefert einen Knoten (oder einen Fehlerknoten). */
  function parseLine(toks) {
    const p = new P(toks);
    const first = toks[0], last = toks[toks.length - 1];
    const opens = last.t === 'op' && last.v === '{';
    const closes = first.t === 'op' && first.v === '}';
    try {
      for (const tk of toks) {
        if (tk.t === 'err') throw new PErr('Ungültiges Zeichen oder Literal: „' + tk.raw + '“');
      }
      if (closes) {
        if (toks.length === 1) return { k: 'close' };
        throw new PErr('„}“ muss allein in einer Zeile stehen');
      }
      if (first.t === 'kw') {
        switch (first.v) {
          case 'else': {
            p.i = 1;
            if (p.isOp('{')) { p.i++; p.expectEnd(); return { k: 'else', inline: null }; }
            if (p.isKw('if')) { p.i++; const h = condHeader(p); return { k: 'elseif', cond: h.cond, inline: h.inline }; }
            if (p.atEnd()) throw new PErr('„{“ fehlt nach else');
            return { k: 'else', inline: bodyStmt(p) };
          }
          case 'if': { p.i = 1; const h = condHeader(p); return { k: 'if', cond: h.cond, inline: h.inline }; }
          case 'while': { p.i = 1; const h = condHeader(p); return { k: 'while', cond: h.cond, inline: h.inline }; }
          case 'for': { p.i = 1; return forHeader(p); }
          case 'return': {
            p.i = 1;
            if (p.isOp(';')) { p.i++; p.expectEnd(); return { k: 'return', e: null }; }
            const e = p.expr();
            p.expectOp(';');
            p.expectEnd();
            return { k: 'return', e };
          }
          default:
            if (MODIFIERS.has(first.v) || TYPES.has(first.v) || first.v === 'void') return declOrMethod(p);
            throw new PErr('„' + first.v + '“ wird hier nicht unterstützt');
        }
      }
      if (first.t === 'id' || (first.t === 'op' && (first.v === '++' || first.v === '--'))) return simpleStmt(p, true);
      if (first.t === 'op' && first.v === ';' && toks.length === 1) return { k: 'empty' };
      if (first.t === 'op' && first.v === '{') throw new PErr('„{“ gehört an das Ende der Zeile davor');
      throw new PErr('Ungültiger Zeilenanfang: „' + first.raw + '“');
    } catch (e) {
      if (!(e instanceof PErr)) throw e;
      let head = null;
      if (first.t === 'kw') {
        if (first.v === 'if') head = 'if';
        else if (first.v === 'else') head = (toks[1] && toks[1].t === 'kw' && toks[1].v === 'if') ? 'elseif' : 'else';
        else if (first.v === 'for' || first.v === 'while') head = 'loop';
        else if (MODIFIERS.has(first.v) || TYPES.has(first.v) || first.v === 'void') {
          head = toks.some(t => t.t === 'op' && t.v === '(') ? 'method' : null;
        }
      }
      return { k: 'error', msg: e.message, opens, closes, head };
    }
  }

  const OPENERS = new Set(['method', 'if', 'elseif', 'else', 'while', 'for']);

  /** Wie parseLine, erkennt aber Kopfzeilen, bei denen nur die "{" fehlt. */
  function parsePiece(toks) {
    const nd = parseLine(toks);
    if (nd.k !== 'error') return nd;
    const last = toks[toks.length - 1];
    if (last.t === 'op' && last.v === '{') return nd;
    const nd2 = parseLine([...toks, { t: 'op', v: '{', raw: '{', ln: last.ln }]);
    if (OPENERS.has(nd2.k) && !nd2.inline) { nd2.missingBrace = true; return nd2; }
    return nd;
  }

  /** Fügt eine logische Zeile hinzu; teilt sie auf, wenn sie sich nur über mehrere Zeilen parsen lässt. */
  function addLogical(L, out) {
    const nd = parsePiece(L.toks);
    if (L.phys.length > 1) {
      const first = L.phys[0];
      const T1 = L.toks.filter(t => t.ln === first);
      const lastT1 = T1[T1.length - 1];
      const headerish = (lastT1.t === 'op' && lastT1.v === ')') ||
        (T1.length === 1 && T1[0].t === 'kw' && T1[0].v === 'else');
      if (nd.k === 'error' || (nd.inline && headerish)) {
        out.push({ toks: T1, phys: [first], home: first, node: parsePiece(T1) });
        const rest = L.toks.filter(t => t.ln !== first);
        addLogical({ toks: rest, phys: [...new Set(rest.map(t => t.ln))], home: rest[0].ln }, out);
        return;
      }
    }
    L.node = nd;
    out.push(L);
  }

  // ------------------------------------------------------------------
  // Blockstruktur aus den logischen Zeilen aufbauen
  // ------------------------------------------------------------------
  function buildStructure(logical, perr, lastLine, firstLine, lines) {
    const root = { k: 'block', stmts: [] };
    const stack = [{ blk: root, lidx: -1, kind: 'root' }];
    let method = null, structural = false, lastClosed = null, lastInline = null;

    const pushInline = (blk, stmt, home) => { stmt.home = home; blk.stmts.push(stmt); };
    const stmtOutside = (L) => { perr.add(L.home, 'Anweisung steht außerhalb der Methode'); structural = true; };

    for (let li = 0; li < logical.length; li++) {
      const L = logical[li];
      const nd = L.node;
      const top = stack[stack.length - 1];
      const justClosed = lastClosed;
      lastClosed = null;
      const prevInline = lastInline;
      lastInline = null;
      nd.home = L.home;
      L.parent = top.lidx;
      switch (nd.k) {
        case 'method': {
          const blk = { k: 'block', stmts: [] };
          nd.body = blk;
          if (stack.length !== 1) {
            perr.add(L.home, 'Eine Methode darf nicht in einer anderen stehen'); structural = true;
            stack.push({ blk, lidx: li, kind: 'generic' });
          } else if (method) {
            perr.add(L.home, 'Hier ist nur eine einzige Methode vorgesehen'); structural = true;
            stack.push({ blk, lidx: li, kind: 'generic' });
          } else {
            method = nd;
            stack.push({ blk, lidx: li, kind: 'method', node: nd });
          }
          break;
        }
        case 'if': {
          if (top.kind === 'root') stmtOutside(L);
          const blk = { k: 'block', stmts: [] };
          nd.then = blk; nd.els = null;
          top.blk.stmts.push(nd);
          if (nd.inline) { pushInline(blk, nd.inline, L.home); lastClosed = { tail: nd }; lastInline = { kind: 'ifpart', tail: nd, blk }; }
          else stack.push({ blk, lidx: li, kind: 'ifpart', tail: nd });
          break;
        }
        case 'while':
        case 'for': {
          if (top.kind === 'root') stmtOutside(L);
          const blk = { k: 'block', stmts: [] };
          nd.body = blk;
          if (nd.k === 'for') {
            if (nd.init) nd.init.home = L.home;
            if (nd.upd) nd.upd.home = L.home;
          }
          top.blk.stmts.push(nd);
          if (nd.inline) { pushInline(blk, nd.inline, L.home); lastInline = { kind: 'loop', blk }; }
          else stack.push({ blk, lidx: li, kind: 'loop' });
          break;
        }
        case 'elseif':
        case 'else': {
          const blk = { k: 'block', stmts: [] };
          if (justClosed && justClosed.tail.els === null) {
            const tail = justClosed.tail;
            if (nd.k === 'else') {
              tail.els = blk;
              if (nd.inline) { pushInline(blk, nd.inline, L.home); lastInline = { kind: 'elsepart', blk }; }
              else stack.push({ blk, lidx: li, kind: 'elsepart' });
            } else {
              const inner = { k: 'if', cond: nd.cond, then: blk, els: null, home: L.home };
              tail.els = inner;
              if (nd.inline) { pushInline(blk, nd.inline, L.home); lastClosed = { tail: inner }; lastInline = { kind: 'ifpart', tail: inner, blk }; }
              else stack.push({ blk, lidx: li, kind: 'ifpart', tail: inner });
            }
          } else {
            perr.add(L.home, 'else ohne passendes if davor'); structural = true;
            if (!nd.inline) stack.push({ blk, lidx: li, kind: 'generic' });
          }
          break;
        }
        case 'close': {
          if (stack.length === 1) {
            let culprit = L.home;
            for (let j = li - 1; j >= 0; j--) {
              const C = logical[j];
              if (C.node.k === 'close' && C.opener >= 0 &&
                  indentWidth(lines[C.home]) !== indentWidth(lines[logical[C.opener].home])) { culprit = C.home; break; }
            }
            perr.add(culprit, 'Zu viele schließende Klammern');
            structural = true; L.opener = -1;
            break;
          }
          const fr = stack.pop();
          L.opener = fr.lidx;
          L.parent = stack[stack.length - 1].lidx;
          if (fr.kind === 'method') fr.node.closeHome = L.home;
          if (fr.kind === 'ifpart') lastClosed = { tail: fr.tail };
          break;
        }
        case 'error': {
          // Fehlerhafte Zeile: Struktur möglichst sinnvoll fortsetzen, damit keine Folgefehler entstehen
          if (nd.closes && stack.length > 1) stack.pop();
          const lone = L.toks.length === 1 && L.toks[0].t === 'op' && L.toks[0].v === '{';
          if (lone && prevInline) {
            stack.push({ blk: prevInline.blk, lidx: li, kind: prevInline.kind, tail: prevInline.tail });
            break;
          }
          if (nd.opens) {
            const blk = { k: 'block', stmts: [] };
            const dummyTail = { k: 'if', els: null, dummy: true };
            if ((nd.head === 'elseif' || nd.head === 'else') && justClosed && justClosed.tail.els === null) {
              justClosed.tail.els = { k: 'dummy' };
            }
            if (nd.head === 'if' || nd.head === 'elseif') stack.push({ blk, lidx: li, kind: 'ifpart', tail: dummyTail });
            else if (nd.head === 'else') stack.push({ blk, lidx: li, kind: 'elsepart' });
            else stack.push({ blk, lidx: li, kind: 'generic' });
          }
          break;
        }
        default: {
          if (top.kind === 'root') stmtOutside(L);
          else top.blk.stmts.push(nd);
        }
      }
    }
    if (stack.length > 1) { perr.add(lastLine, 'Es fehlt mindestens eine schließende Klammer'); structural = true; }
    if (!method && !structural) { perr.add(firstLine, 'Methodenkopf fehlt'); structural = true; }
    return { method, structural };
  }

  // ------------------------------------------------------------------
  // Einrückung
  // ------------------------------------------------------------------
  function indentWidth(s) {
    let w = 0;
    for (const ch of String(s)) {
      if (ch === ' ' || ch === ' ') w++;
      else if (ch === '\t') w = (Math.floor(w / 4) + 1) * 4;
      else break;
    }
    return w;
  }

  function checkIndent(logical, lines, perPhys, ferr, editable) {
    const clean = L => L.phys.length === 1 && perPhys.get(L.home).length === 1 && !L.node.inline;
    const groups = new Map();
    const closes = [];
    const badIndent = new Set();
    for (const L of logical) {
      if (L.node.k === 'close') { closes.push(L); continue; }
      if (L.parent >= 0) {
        if (!groups.has(L.parent)) groups.set(L.parent, []);
        groups.get(L.parent).push(L);
      }
    }
    for (const [pi, arr] of groups) {
      const pw = indentWidth(lines[logical[pi].home]);
      const cand = arr.filter(clean);
      if (!cand.length) continue;
      let ref;
      const fixed = editable ? cand.find(L => !editable[L.home]) : null;
      if (fixed) ref = indentWidth(lines[fixed.home]);
      else {
        // häufigste Einrückung unter den Zeilen, die überhaupt weiter eingerückt sind
        const cnt = new Map();
        let best = null, bestN = 0;
        for (const L of cand) {
          const w = indentWidth(lines[L.home]);
          if (w <= pw) continue;
          const n = (cnt.get(w) || 0) + 1;
          cnt.set(w, n);
          if (n > bestN) { best = w; bestN = n; }
        }
        ref = best;
      }
      for (const L of cand) {
        const w = indentWidth(lines[L.home]);
        if (w <= pw) { ferr.add(L.home, 'Die Zeile muss weiter eingerückt sein als die Zeile mit der öffnenden Klammer'); badIndent.add(L.home); }
        else if (w !== ref) { ferr.add(L.home, 'Zeilen auf derselben Ebene müssen gleich weit eingerückt sein'); badIndent.add(L.home); }
      }
    }
    for (const L of closes) {
      if (L.opener < 0 || !clean(L)) continue;
      const O = logical[L.opener];
      if (indentWidth(lines[L.home]) !== indentWidth(lines[O.home])) {
        ferr.add(L.home, 'Die schließende Klammer muss genau so weit eingerückt sein wie die Zeile mit der öffnenden Klammer');
      } else if (badIndent.has(O.home)) {
        ferr.add(L.home, 'Die schließende Klammer muss genau so weit eingerückt sein wie die (richtig eingerückte) Zeile mit der öffnenden Klammer');
      }
    }
  }

  // ------------------------------------------------------------------
  // Werte, Umwandlungen, Rechnen (Java-Semantik)
  // ------------------------------------------------------------------
  const isNum = t => t === 'int' || t === 'double' || t === 'char';

  function d2i(d) {
    if (Number.isNaN(d)) return 0;
    if (d >= 2147483647) return 2147483647;
    if (d <= -2147483648) return -2147483648;
    return Math.trunc(d) | 0;
  }

  function convert(x, from, to) {
    if (from === to || to === 'boolean' || to === 'double') return x;
    if (to === 'int') return from === 'double' ? d2i(x) : x;
    if (to === 'char') return (from === 'double' ? d2i(x) : x) & 0xFFFF;
    return x;
  }

  function applyArith(op, ty, a, b) {
    if (ty === 'int') {
      switch (op) {
        case '+': return (a + b) | 0;
        case '-': return (a - b) | 0;
        case '*': return Math.imul(a, b);
        case '/': if (b === 0) throw ARITH_EX; return (a / b) | 0;
        case '%': if (b === 0) throw ARITH_EX; return (a % b) | 0;
      }
    }
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return a / b;
      case '%': return a % b;
    }
    throw new Error('Unbekannter Operator ' + op);
  }

  function applyBin(op, ty, a, b) {
    switch (op) {
      case '==': return a === b;
      case '!=': return a !== b;
      case '<': return a < b;
      case '>': return a > b;
      case '<=': return a <= b;
      case '>=': return a >= b;
      case '&&': return a && b;
      case '||': return a || b;
      default: return applyArith(op, ty, a, b);
    }
  }

  function assignable(e, target) {
    const s = e.ty;
    if (s === target) return true;
    if (target === 'double' && (s === 'int' || s === 'char')) return true;
    if (target === 'int' && s === 'char') return true;
    if (target === 'char' && s === 'int' && e.cv !== undefined && e.cv >= 0 && e.cv <= 65535) return true;
    return false;
  }

  // ------------------------------------------------------------------
  // Typprüfung (wie der Compiler)
  // ------------------------------------------------------------------
  function compileMethod(method, spec, cerr) {
    if (spec) {
      const okName = method.name === spec.name;
      const okRet = method.ret === spec.ret;
      const okParams = method.params.length === spec.params.length &&
        method.params.every((p, i) => p.ty === spec.params[i].ty);
      if (!okName || !okRet || !okParams) cerr.add(method.home, 'Der Methodenkopf passt nicht zur Aufgabenstellung (Name, Rückgabetyp oder Parametertypen)');
    }
    let nextId = 0;
    const root = { vars: new Map(), parent: null };
    const paramVars = [];
    for (const p of method.params) {
      if (root.vars.has(p.name)) { cerr.add(method.home, 'Zwei Parameter heißen gleich'); }
      const v = { id: nextId++, ty: p.ty, name: p.name };
      root.vars.set(p.name, v);
      paramVars.push(v);
    }
    const lookup = (sc, name) => {
      for (let s = sc; s; s = s.parent) { const v = s.vars.get(name); if (v) return v; }
      return null;
    };
    const declare = (sc, name, ty, line) => {
      if (lookup(sc, name)) cerr.add(line, 'Die Variable ' + name + ' gibt es hier bereits');
      const v = { id: nextId++, ty, name };
      sc.vars.set(name, v);
      return v;
    };
    const fail = (n, line, msg) => { cerr.add(line, msg); n.ty = 'err'; };

    function typeExpr(n, sc, line) {
      switch (n.k) {
        case 'lit': n.cv = n.v; return;
        case 'var': {
          const v = lookup(sc, n.name);
          if (!v) return fail(n, line, n.name + ' ist hier nicht bekannt');
          n.v = v; n.ty = v.ty;
          return;
        }
        case 'un': {
          typeExpr(n.e, sc, line);
          const t = n.e.ty;
          if (t === 'err') { n.ty = 'err'; return; }
          if (n.op === '!') {
            if (t !== 'boolean') return fail(n, line, '! passt nur zu boolean');
            n.ty = 'boolean';
            if (n.e.cv !== undefined) n.cv = !n.e.cv;
            return;
          }
          if (!isNum(t)) return fail(n, line, 'Vorzeichen passt nur zu Zahlen');
          n.ty = t === 'double' ? 'double' : 'int';
          if (n.e.cv !== undefined) n.cv = n.op === '-' ? (n.ty === 'int' ? (-n.e.cv) | 0 : -n.e.cv) : n.e.cv;
          return;
        }
        case 'cast': {
          typeExpr(n.e, sc, line);
          const t = n.e.ty;
          if (t === 'err') { n.ty = 'err'; return; }
          if ((n.to === 'boolean') !== (t === 'boolean')) return fail(n, line, 'Diese Typumwandlung ist nicht möglich');
          n.ty = n.to;
          if (n.e.cv !== undefined) n.cv = convert(n.e.cv, t, n.to);
          return;
        }
        case 'bin': {
          typeExpr(n.l, sc, line);
          typeExpr(n.r, sc, line);
          const a = n.l.ty, b = n.r.ty;
          if (a === 'err' || b === 'err') { n.ty = 'err'; return; }
          const op = n.op;
          if (ARITH.has(op)) {
            if (!isNum(a) || !isNum(b)) return fail(n, line, 'Mit diesen Werten kann man nicht rechnen');
            n.ty = (a === 'double' || b === 'double') ? 'double' : 'int';
          } else if (REL.has(op)) {
            if (!isNum(a) || !isNum(b)) return fail(n, line, 'Diese Werte kann man nicht mit ' + op + ' vergleichen');
            n.ty = 'boolean';
          } else if (op === '==' || op === '!=') {
            if (!((isNum(a) && isNum(b)) || (a === 'boolean' && b === 'boolean'))) return fail(n, line, 'Diese Werte kann man nicht vergleichen');
            n.ty = 'boolean';
          } else {
            if (a !== 'boolean' || b !== 'boolean') return fail(n, line, op + ' verknüpft nur Wahrheitswerte');
            n.ty = 'boolean';
          }
          if (n.l.cv !== undefined && n.r.cv !== undefined) {
            try { n.cv = applyBin(op, n.ty, n.l.cv, n.r.cv); } catch (e) { if (e !== ARITH_EX) throw e; }
          }
          return;
        }
      }
    }

    const needBool = (e, line) => {
      if (e.ty !== 'err' && e.ty !== 'boolean') cerr.add(line, 'Eine Bedingung muss true oder false ergeben (Typ boolean)');
    };

    function checkBlock(b, sc) {
      const inner = { vars: new Map(), parent: sc };
      for (const s of b.stmts) checkStmt(s, inner);
    }

    function checkStmt(s, sc) {
      const line = s.home;
      switch (s.k) {
        case 'decl':
          for (const d of s.decls) {
            if (d.init) {
              typeExpr(d.init, sc, line);
              if (d.init.ty !== 'err' && !assignable(d.init, s.ty)) cerr.add(line, 'Der Wert passt nicht zum Datentyp ' + s.ty);
            }
            d.v = declare(sc, d.name, s.ty, line);
          }
          return;
        case 'assign': {
          typeExpr(s.e, sc, line);
          const v = lookup(sc, s.name);
          if (!v) { cerr.add(line, s.name + ' ist hier nicht bekannt'); return; }
          s.v = v;
          if (s.e.ty !== 'err' && !assignable(s.e, v.ty)) cerr.add(line, 'Der Wert passt nicht zum Datentyp ' + v.ty);
          return;
        }
        case 'compound': {
          typeExpr(s.e, sc, line);
          const v = lookup(sc, s.name);
          if (!v) { cerr.add(line, s.name + ' ist hier nicht bekannt'); return; }
          s.v = v;
          if (s.e.ty === 'err') return;
          if (!isNum(v.ty) || !isNum(s.e.ty)) { cerr.add(line, 'Mit diesen Werten kann man nicht rechnen'); return; }
          s.pty = (v.ty === 'double' || s.e.ty === 'double') ? 'double' : 'int';
          return;
        }
        case 'incdec': {
          const v = lookup(sc, s.name);
          if (!v) { cerr.add(line, s.name + ' ist hier nicht bekannt'); return; }
          s.v = v;
          if (!isNum(v.ty)) cerr.add(line, '++ und -- gehen nur bei Zahlen');
          return;
        }
        case 'return':
          s.rty = method.ret;
          if (s.e) {
            typeExpr(s.e, sc, line);
            if (method.ret === 'void') cerr.add(line, 'Eine void-Methode gibt keinen Wert zurück');
            else if (s.e.ty !== 'err' && !assignable(s.e, method.ret)) cerr.add(line, 'Der Rückgabewert passt nicht zum Rückgabetyp ' + method.ret);
          } else if (method.ret !== 'void') cerr.add(line, 'Hier fehlt der Rückgabewert');
          return;
        case 'empty':
          return;
        case 'if':
          typeExpr(s.cond, sc, line);
          needBool(s.cond, line);
          checkBlock(s.then, sc);
          if (s.els) { if (s.els.k === 'if') checkStmt(s.els, sc); else checkBlock(s.els, sc); }
          return;
        case 'while':
          typeExpr(s.cond, sc, line);
          needBool(s.cond, line);
          checkBlock(s.body, sc);
          return;
        case 'for': {
          const fs = { vars: new Map(), parent: sc };
          if (s.init) checkStmt(s.init, fs);
          if (s.cond) { typeExpr(s.cond, fs, line); needBool(s.cond, line); }
          if (s.upd) checkStmt(s.upd, fs);
          checkBlock(s.body, fs);
          return;
        }
      }
    }

    checkBlock(method.body, root);
    return { nVars: nextId, paramVars };
  }

  // ------------------------------------------------------------------
  // Erreichbarkeit, fehlendes return, Variablen ohne Wert (wie javac)
  // ------------------------------------------------------------------
  const ALL = null;
  const inter = (a, b) => {
    if (a === ALL) return b;
    if (b === ALL) return a;
    const r = new Set();
    for (const x of a) if (b.has(x)) r.add(x);
    return r;
  };
  const plus = (a, id) => { if (a === ALL) return ALL; const r = new Set(a); r.add(id); return r; };

  function flowMethod(method, paramVars, cerr) {
    function readsOk(e, da, line) {
      if (!e) return;
      switch (e.k) {
        case 'var':
          if (da !== ALL && e.v && !da.has(e.v.id)) cerr.add(line, 'Die Variable ' + e.name + ' hat hier eventuell noch keinen Wert');
          return;
        case 'un': case 'cast': readsOk(e.e, da, line); return;
        case 'bin':
          if (e.op === '&&' || e.op === '||') { condDA(e, da, line); return; }
          readsOk(e.l, da, line); readsOk(e.r, da, line);
          return;
      }
    }
    function condDA(e, da, line) {
      if (e.cv === true) return { t: da, f: ALL };
      if (e.cv === false) return { t: ALL, f: da };
      if (e.k === 'bin' && e.op === '&&') { const a = condDA(e.l, da, line); const b = condDA(e.r, a.t, line); return { t: b.t, f: inter(a.f, b.f) }; }
      if (e.k === 'bin' && e.op === '||') { const a = condDA(e.l, da, line); const b = condDA(e.r, a.f, line); return { t: inter(a.t, b.t), f: b.f }; }
      if (e.k === 'un' && e.op === '!') { const a = condDA(e.e, da, line); return { t: a.f, f: a.t }; }
      readsOk(e, da, line);
      return { t: da, f: da };
    }
    function flowBlock(b, da) {
      let cur = da, cc = true;
      for (const s of b.stmts) {
        if (!cc) { cerr.add(s.home, 'Diese Anweisung kann nie erreicht werden'); return { da: ALL, cc: false }; }
        const r = flowStmt(s, cur);
        cur = r.da; cc = r.cc;
      }
      return { da: cur, cc };
    }
    function flowStmt(s, da) {
      const line = s.home;
      switch (s.k) {
        case 'decl': {
          let cur = da;
          for (const d of s.decls) if (d.init) { readsOk(d.init, cur, line); cur = plus(cur, d.v.id); }
          return { da: cur, cc: true };
        }
        case 'assign':
          readsOk(s.e, da, line);
          return { da: plus(da, s.v.id), cc: true };
        case 'compound':
        case 'incdec':
          if (s.e) readsOk(s.e, da, line);
          if (da !== ALL && !da.has(s.v.id)) cerr.add(line, 'Die Variable ' + s.name + ' hat hier eventuell noch keinen Wert');
          return { da, cc: true };
        case 'return':
          if (s.e) readsOk(s.e, da, line);
          return { da: ALL, cc: false };
        case 'empty':
          return { da, cc: true };
        case 'if': {
          const c = condDA(s.cond, da, line);
          const r1 = flowBlock(s.then, c.t);
          if (!s.els) return { da: inter(r1.da, c.f), cc: true };
          const r2 = s.els.k === 'if' ? flowStmt(s.els, c.f) : flowBlock(s.els, c.f);
          return { da: inter(r1.da, r2.da), cc: r1.cc || r2.cc };
        }
        case 'while': {
          const c = condDA(s.cond, da, line);
          if (s.cond.cv === false) { cerr.add(line, 'Der Schleifenrumpf kann nie erreicht werden'); return { da: c.f, cc: true }; }
          flowBlock(s.body, c.t);
          return { da: c.f, cc: s.cond.cv !== true };
        }
        case 'for': {
          let cur = da;
          if (s.init) cur = flowStmt(s.init, cur).da;
          const c = s.cond ? condDA(s.cond, cur, line) : { t: cur, f: ALL };
          if (s.cond && s.cond.cv === false) { cerr.add(line, 'Der Schleifenrumpf kann nie erreicht werden'); return { da: c.f, cc: true }; }
          const r = flowBlock(s.body, c.t);
          if (s.upd) flowStmt(s.upd, r.cc ? r.da : ALL);
          return { da: c.f, cc: !(s.cond == null || s.cond.cv === true) };
        }
      }
      return { da, cc: true };
    }
    const r = flowBlock(method.body, new Set(paramVars.map(v => v.id)));
    if (r.cc && method.ret !== 'void') cerr.add(method.closeHome, 'Die Methode kann enden, ohne einen Wert zurückzugeben (return fehlt)');
  }

  // ------------------------------------------------------------------
  // Interpreter
  // ------------------------------------------------------------------
  function ev(n, env) {
    if (n.cv !== undefined) return n.cv;
    switch (n.k) {
      case 'var': return env[n.v.id];
      case 'un': {
        const x = ev(n.e, env);
        if (n.op === '!') return !x;
        if (n.op === '-') return n.ty === 'int' ? (-x) | 0 : -x;
        return x;
      }
      case 'cast': return convert(ev(n.e, env), n.e.ty, n.ty);
      case 'bin': {
        const op = n.op;
        if (op === '&&') return ev(n.l, env) ? ev(n.r, env) : false;
        if (op === '||') return ev(n.l, env) ? true : ev(n.r, env);
        return applyBin(op, n.ty, ev(n.l, env), ev(n.r, env));
      }
      case 'lit': return n.v;
    }
    throw new Error('Unbekannter Ausdruck');
  }

  function execBlock(b, env, ctx) {
    const st = b.stmts;
    for (let i = 0; i < st.length; i++) {
      const r = exec(st[i], env, ctx);
      if (r) return r;
    }
    return null;
  }

  function exec(s, env, ctx) {
    if (++ctx.steps > STEP_LIMIT) throw TIMEOUT_EX;
    switch (s.k) {
      case 'decl':
        for (const d of s.decls) env[d.v.id] = d.init ? convert(ev(d.init, env), d.init.ty, s.ty) : undefined;
        return null;
      case 'assign':
        env[s.v.id] = convert(ev(s.e, env), s.e.ty, s.v.ty);
        return null;
      case 'compound': {
        const r = applyArith(s.op, s.pty, env[s.v.id], ev(s.e, env));
        env[s.v.id] = convert(r, s.pty, s.v.ty);
        return null;
      }
      case 'incdec': {
        const v = s.v, d = s.op === '++' ? 1 : -1, x = env[v.id];
        env[v.id] = v.ty === 'int' ? (x + d) | 0 : v.ty === 'char' ? (x + d) & 0xFFFF : x + d;
        return null;
      }
      case 'return':
        return { v: s.e ? convert(ev(s.e, env), s.e.ty, s.rty) : undefined };
      case 'empty':
        return null;
      case 'if':
        if (ev(s.cond, env)) return execBlock(s.then, env, ctx);
        if (s.els) return s.els.k === 'if' ? exec(s.els, env, ctx) : execBlock(s.els, env, ctx);
        return null;
      case 'while':
        while (ev(s.cond, env)) {
          if (++ctx.steps > STEP_LIMIT) throw TIMEOUT_EX;
          const r = execBlock(s.body, env, ctx);
          if (r) return r;
        }
        return null;
      case 'for':
        if (s.init) exec(s.init, env, ctx);
        while (!s.cond || ev(s.cond, env)) {
          if (++ctx.steps > STEP_LIMIT) throw TIMEOUT_EX;
          const r = execBlock(s.body, env, ctx);
          if (r) return r;
          if (s.upd) exec(s.upd, env, ctx);
        }
        return null;
    }
    throw new Error('Unbekannte Anweisung ' + s.k);
  }

  function makeRunner(program) {
    return function run(args) {
      const env = new Array(program.nVars);
      program.paramVars.forEach((v, i) => { env[v.id] = args[i]; });
      const r = execBlock(program.method.body, env, { steps: 0 });
      return r ? r.v : undefined;
    };
  }

  // ------------------------------------------------------------------
  // Gesamtanalyse eines Codes
  // ------------------------------------------------------------------
  function analyze(lines, spec, editable) {
    const errs = { parse: new ErrSet(), compile: new ErrSet(), format: new ErrSet() };
    const tk = tokenize(lines);
    const nonEmpty = [];
    tk.lines.forEach((t, i) => { if (t.length) nonEmpty.push(i); });
    if (!nonEmpty.length) return { empty: true, errs, logical: [] };
    const lastLine = nonEmpty[nonEmpty.length - 1];
    if (tk.openComment) errs.parse.add(lastLine, 'Ein Kommentar /* wird nicht geschlossen');

    // logische Zeilen bilden und parsen
    const logical = [];
    for (const L of reflow(tk.lines)) addLogical(L, logical);
    for (const L of logical) {
      L.editable = editable ? L.phys.some(p => !!editable[p]) : true;
      if (L.node.k === 'error') errs.parse.add(L.home, L.node.msg);
      if (L.node.missingBrace) errs.parse.add(L.home, '„{“ fehlt am Zeilenende');
    }

    // Schreibweise: genau eine Anweisung bzw. Klammer pro Zeile
    const perPhys = new Map();
    for (const L of logical) for (const p of L.phys) {
      if (!perPhys.has(p)) perPhys.set(p, []);
      perPhys.get(p).push(L);
    }
    for (const L of logical) {
      if (L.phys.length > 1) for (const p of L.phys) errs.format.add(p, 'Eine Anweisung bzw. Klammer ist auf mehrere Zeilen verteilt');
      if (L.node.inline) errs.format.add(L.home, 'Die geschweiften Klammern fehlen');
    }
    for (const [p, arr] of perPhys) if (arr.length > 1) errs.format.add(p, 'In dieser Zeile steht mehr als eine Anweisung bzw. Klammer');

    // Blockstruktur
    const st = buildStructure(logical, errs.parse, lastLine, nonEmpty[0], lines);
    if (!st.structural) checkIndent(logical, lines, perPhys, errs.format, editable);

    // Übersetzen
    let program = null;
    if (!errs.parse.size && !st.structural && st.method) {
      const c = compileMethod(st.method, spec, errs.compile);
      if (!errs.compile.size) {
        flowMethod(st.method, c.paramVars, errs.compile);
        if (!errs.compile.size) program = { method: st.method, nVars: c.nVars, paramVars: c.paramVars };
      }
    }
    return { empty: false, errs, logical, method: st.method, program };
  }

  // ------------------------------------------------------------------
  // Aufgaben vorbereiten, testen, Fehler lokalisieren
  // ------------------------------------------------------------------
  function argValue(v, ty) {
    if (ty === 'char') return typeof v === 'string' ? v.charCodeAt(0) : v;
    return v;
  }

  function same(a, b, ty) {
    if (a === b) return true;
    if (ty === 'double' && typeof a === 'number' && typeof b === 'number') {
      if (Number.isNaN(a) && Number.isNaN(b)) return true;
      return Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
    }
    return false;
  }

  function prepareTask(task) {
    const spec = task.method;
    const variants = task.solutions.map(src => ({ src, a: analyze(src.split('\n'), spec) }));
    const ref = variants[0].a;
    if (!ref.program) throw new Error('Referenzlösung lässt sich nicht übersetzen: ' + task.id);
    const run = makeRunner(ref.program);
    const args = [], expected = [];
    for (const row of task.tests) {
      const a = row.map((v, i) => argValue(v, spec.params[i].ty));
      try { expected.push(run(a)); args.push(a); } catch (e) { if (!e || !e.javaException) throw e; }
    }
    return { spec, variants, args, expected };
  }

  function passesAll(program, prep) {
    const run = makeRunner(program);
    for (let i = 0; i < prep.args.length; i++) {
      let r;
      try { r = run(prep.args[i]); } catch (e) { if (e && e.javaException) return false; throw e; }
      if (!same(r, prep.expected[i], prep.spec.ret)) return false;
    }
    return true;
  }

  function declNames(a) {
    const out = [];
    for (const L of a.logical) {
      const n = L.node;
      if (!n) continue;
      if (n.k === 'decl') n.decls.forEach(d => out.push(d.name));
      else if (n.k === 'for' && n.init && n.init.k === 'decl') n.init.decls.forEach(d => out.push(d.name));
    }
    return out;
  }

  function renameMap(va, sa) {
    const m = new Map();
    if (va.method && sa.method && va.method.params.length === sa.method.params.length) {
      va.method.params.forEach((p, i) => { if (p.name !== sa.method.params[i].name) m.set(p.name, sa.method.params[i].name); });
    }
    const vd = declNames(va), sd = declNames(sa);
    if (vd.length === sd.length) vd.forEach((n, i) => { if (n !== sd[i]) m.set(n, sd[i]); });
    return m;
  }

  const normToks = (L, ren) => L.toks.map(t => (t.t === 'id' && ren && ren.has(t.v)) ? ren.get(t.v) : t.raw).join(' ');
  const uniqSorted = arr => [...new Set(arr)].sort((a, b) => a - b);

  /** Versucht, die Zeile(n) mit dem Semantikfehler zu finden. Liefert null, wenn das nicht eindeutig geht. */
  function locate(a, prep) {
    const SL = a.logical;
    const sNorm = SL.map(L => normToks(L, null));
    const attempts = [];
    for (const v of prep.variants) {
      const VL = v.a.logical;
      if (VL.length !== SL.length) continue;
      const ren = renameMap(v.a, a);
      const vNorm = VL.map(L => normToks(L, ren));
      const D = [];
      let bad = false;
      for (let i = 0; i < SL.length; i++) {
        if (vNorm[i] !== sNorm[i]) {
          if (!SL[i].editable) { bad = true; break; }
          D.push(i);
        }
      }
      if (!bad && D.length) attempts.push({ D, vNorm });
    }
    attempts.sort((x, y) => x.D.length - y.D.length);
    const ok = arr => { const c = analyze(arr, prep.spec); return !!c.program && passesAll(c.program, prep); };

    for (const at of attempts) {
      const fixes = at.D.filter(i => ok(sNorm.map((s, j) => (j === i ? at.vNorm[i] : s))));
      if (fixes.length) return uniqSorted(fixes.map(i => SL[i].home));
    }
    const dels = [];
    for (let i = 0; i < SL.length; i++) {
      if (!SL[i].editable || SL[i].node.k === 'close') continue;
      if (ok(sNorm.filter((_, j) => j !== i))) dels.push(i);
    }
    if (dels.length) return uniqSorted(dels.map(i => SL[i].home));
    for (const at of attempts) {
      if (at.D.length > 6) continue;
      for (let x = 0; x < at.D.length; x++) {
        for (let y = x + 1; y < at.D.length; y++) {
          const i = at.D[x], j = at.D[y];
          if (ok(sNorm.map((s, k) => (k === i ? at.vNorm[i] : k === j ? at.vNorm[j] : s)))) return uniqSorted([SL[i].home, SL[j].home]);
        }
      }
    }
    return null;
  }

  /**
   * Bewertet einen Schülercode.
   * lines: Array der Zeilen (Strings), editable: Array<boolean> (welche Zeilen der Schüler bearbeitet)
   */
  function evaluate(prep, lines, editable) {
    const a = analyze(lines, prep.spec, editable);
    if (a.empty) return { empty: true, solved: false };
    const syntax = new Map();
    for (const es of [a.errs.parse, a.errs.compile, a.errs.format]) {
      for (const [ln, msgs] of es.map) {
        if (!syntax.has(ln)) syntax.set(ln, []);
        for (const m of msgs) if (!syntax.get(ln).includes(m)) syntax.get(ln).push(m);
      }
    }
    let semantic = 'skipped', semLines = null;
    if (a.program) {
      if (passesAll(a.program, prep)) semantic = 'ok';
      else { semantic = 'fail'; semLines = locate(a, prep); }
    }
    return { empty: false, syntax, semantic, semLines, solved: syntax.size === 0 && semantic === 'ok' };
  }

  /** Führt eine Methode (Java-Quelltext) mit Argumenten aus – für Lese-Aufgaben und Tests. */
  function runSource(src, spec, args) {
    const a = analyze(src.split('\n'), spec || null);
    if (!a.program) {
      const msgs = [];
      for (const es of [a.errs.parse, a.errs.compile]) for (const [ln, m] of es.map) msgs.push('Zeile ' + (ln + 1) + ': ' + m.join('; '));
      throw new Error('Quelltext fehlerhaft: ' + msgs.join(' | '));
    }
    const types = a.program.paramVars.map(v => v.ty);
    return makeRunner(a.program)((args || []).map((v, i) => argValue(v, types[i])));
  }

  const api = { tokenize, analyze, prepareTask, evaluate, runSource, indentWidth, passesAll, makeRunner };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else global.JavaMini = api;
})(typeof window !== 'undefined' ? window : this);
