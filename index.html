<script>
/* Oberfläche der Seite „Die if-Anweisung“ */
(function () {
  'use strict';

  const J = window.JavaMini;
  const STORE_KEY = 'informatik-ef-if-anweisung-2026-v1';

  // ------------------------------------------------------------------
  // Hilfsfunktionen
  // ------------------------------------------------------------------
  function el(tag, attrs, ...children) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'html') e.innerHTML = v;
        else if (k === 'text') e.textContent = v;
        else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const c of children) if (c != null) e.append(c);
    return e;
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function cyrb53(str, seed = 7) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }

  function decodeData(b64, key) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }

  const DATA = decodeData(window.__IF_DATA__, window.__IF_KEY__);
  const TEACHER_HASH = window.__IF_T__;

  // ------------------------------------------------------------------
  // Syntaxhervorhebung (nur zur Anzeige)
  // ------------------------------------------------------------------
  const KW = new Set(['public', 'private', 'protected', 'static', 'void', 'if', 'else', 'for', 'while', 'return', 'new', 'class']);
  const TY = new Set(['int', 'double', 'char', 'boolean']);
  const LIT = new Set(['true', 'false', 'null']);
  const TOKEN_RE = /(⟨[^⟩]*⟩)|(\/\/.*$)|("(?:\\.|[^"\\])*"?)|('(?:\\.|[^'\\])*'?)|(\d+(?:\.\d+)?)|([A-Za-z_$\u00C0-\u024F][\w$\u00C0-\u024F]*)|([\s\S])/g;

  function hl(line) {
    let out = '';
    line.replace(TOKEN_RE, (m, ph, com, str, chr, num, word, other) => {
      if (ph) out += '<span class="t-ph">' + esc(ph.slice(1, -1)) + '</span>';
      else if (com) out += '<span class="t-com">' + esc(com) + '</span>';
      else if (str || chr) out += '<span class="t-str">' + esc(m) + '</span>';
      else if (num) out += '<span class="t-num">' + esc(num) + '</span>';
      else if (word) {
        if (KW.has(word)) out += '<span class="t-kw">' + word + '</span>';
        else if (TY.has(word)) out += '<span class="t-ty">' + word + '</span>';
        else if (LIT.has(word)) out += '<span class="t-lit">' + word + '</span>';
        else out += esc(word);
      } else out += esc(other);
      return m;
    });
    return out;
  }

  function codeBlock(code, cls) {
    const lines = code.split('\n');
    return '<pre class="codeblock' + (cls ? ' ' + cls : '') + '"><code>' +
      lines.map((l, i) => '<span class="cl"><span class="cln">' + (i + 1) + '</span><span class="clt">' + (hl(l) || ' ') + '</span></span>').join('') +
      '</code></pre>';
  }

  function lineList(nums) {
    const n = nums.map(x => x + 1);
    if (n.length === 1) return 'Zeile ' + n[0];
    return 'den Zeilen ' + n.slice(0, -1).join(', ') + ' und ' + n[n.length - 1];
  }

  // ------------------------------------------------------------------
  // Zustand (Fortschritt im Browser)
  // ------------------------------------------------------------------
  const isTeacherHash = () => {
    let h = '';
    try { h = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) { h = location.hash.replace(/^#/, ''); }
    h = h.trim().toLowerCase();
    return !!h && cyrb53(h) === TEACHER_HASH;
  };
  const teacher = isTeacherHash();
  const fresh = () => ({ v: 1, solved: {}, code: {}, answers: {} });
  let storageOk = true;
  function loadState() {
    if (teacher) return fresh();
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && s.v === 1 && s.solved && s.code && s.answers) return s;
    } catch (e) { storageOk = false; }
    return fresh();
  }
  const state = loadState();
  let saveTimer = null;
  let resetting = false;
  function saveState(now) {
    if (teacher || resetting) return;
    clearTimeout(saveTimer);
    const doSave = () => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
      catch (e) { storageOk = false; }
    };
    if (now) doSave(); else saveTimer = setTimeout(doSave, 300);
  }
  window.addEventListener('beforeunload', () => saveState(true));
  window.addEventListener('hashchange', () => { if (isTeacherHash() !== teacher) location.reload(); });

  // ------------------------------------------------------------------
  // Schritte
  // ------------------------------------------------------------------
  const steps = [
    ...DATA.explanations.map((e, i) => ({ kind: 'explain', id: e.id, num: i + 1, data: e })),
    ...DATA.tasks.map((t, i) => ({ kind: t.type, id: t.id, num: i + 1, data: t }))
  ];
  const preps = {};
  const getPrep = t => (preps[t.id] = preps[t.id] || J.prepareTask(t));

  // ------------------------------------------------------------------
  // Zeilen-Editor
  // ------------------------------------------------------------------
  class Editor {
    constructor(task, saved, onChange, onSubmit) {
      this.sk = task.rows;
      this.onChange = onChange;
      this.onSubmit = onSubmit;
      this.readOnly = false;
      this.root = el('div', { class: 'editor', role: 'group', 'aria-label': 'Code-Editor' });
      this.inner = el('div', { class: 'editor-in' });
      this.root.append(this.inner);
      this.rows = this.initRows(saved);
      this.rows.forEach(r => this.inner.append(this.makeRow(r)));
      this.renumber();
    }

    freshRows() {
      return this.sk.map((r, i) => (typeof r === 'string' ? { k: 'f', i } : Array.isArray(r) ? { k: 'i', i, v: '' } : { k: 'e', v: '' }));
    }

    initRows(saved) {
      if (!Array.isArray(saved)) return this.freshRows();
      const refs = saved.filter(r => r && (r.k === 'f' || r.k === 'i')).map(r => r.i);
      const expected = this.sk.map((r, i) => (r === null ? -1 : i)).filter(i => i >= 0);
      const valid = refs.length === expected.length && refs.every((x, j) => x === expected[j]) &&
        saved.every(r => r && (r.k === 'e' || (r.k === 'f' && typeof this.sk[r.i] === 'string') || (r.k === 'i' && Array.isArray(this.sk[r.i])))) &&
        (this.sk.some(r => r === null) || !saved.some(r => r.k === 'e'));
      if (!valid) return this.freshRows();
      return saved.map(r => (r.k === 'f' ? { k: 'f', i: r.i } : { k: r.k, i: r.i, v: typeof r.v === 'string' ? r.v : '' }));
    }

    serialize() { return this.rows.map(r => (r.k === 'f' ? { k: 'f', i: r.i } : r.k === 'i' ? { k: 'i', i: r.i, v: r.v } : { k: 'e', v: r.v })); }
    getLines() { return this.rows.map(r => (r.k === 'f' ? this.sk[r.i] : r.k === 'i' ? this.sk[r.i][0] + r.v + this.sk[r.i][1] : r.v)); }
    getEditable() { return this.rows.map(r => r.k !== 'f'); }
    allEmpty() { return this.rows.every(r => r.k === 'f' || r.v.trim() === ''); }

    makeRow(r) {
      const row = el('div', { class: 'erow ' + (r.k === 'f' ? 'fixed' : r.k === 'i' ? 'inline' : 'edit') });
      r.lnEl = el('span', { class: 'eln' });
      r.markEl = el('span', { class: 'emark', 'aria-hidden': 'true' });
      row.append(r.lnEl, r.markEl);
      r.input = null;
      if (r.k === 'f') {
        row.append(el('span', { class: 'esrc', html: hl(this.sk[r.i]) || ' ' }));
      } else {
        const inp = el('input', { type: 'text', class: r.k === 'i' ? 'einline' : 'eline', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off' });
        inp.value = r.v;
        inp.readOnly = this.readOnly;
        r.input = inp;
        if (r.k === 'i') {
          const [pre, post] = this.sk[r.i];
          row.append(el('span', { class: 'esrc', html: hl(pre) }), inp, el('span', { class: 'esrc', html: hl(post) }));
          this.autosize(inp);
        } else {
          row.append(inp);
        }
        inp.addEventListener('input', () => this.changed(r));
        inp.addEventListener('keydown', e => this.onKey(r, e));
        inp.addEventListener('paste', e => this.onPaste(r, e));
      }
      r.el = row;
      return row;
    }

    autosize(inp) { inp.style.width = Math.max(10, inp.value.length + 2) + 'ch'; }

    renumber() {
      this.rows.forEach((r, i) => {
        r.lnEl.textContent = String(i + 1);
        if (r.input) r.input.setAttribute('aria-label', 'Zeile ' + (i + 1));
      });
    }

    changed(r) {
      if (r.input) {
        r.v = r.input.value;
        if (r.k === 'i') this.autosize(r.input);
      }
      this.unmark(r);
      if (this.onChange) this.onChange();
    }

    insertAfter(idx, nr) {
      this.rows.splice(idx + 1, 0, nr);
      const node = this.makeRow(nr);
      this.rows[idx].el.after(node);
      this.renumber();
      if (this.onChange) this.onChange();
      return nr;
    }

    remove(idx) {
      const r = this.rows[idx];
      r.el.remove();
      this.rows.splice(idx, 1);
      this.renumber();
      if (this.onChange) this.onChange();
    }

    focusRow(r, pos) {
      if (!r || !r.input) return;
      r.input.focus();
      const len = r.input.value.length;
      const p = pos === 'end' ? len : Math.max(0, Math.min(pos, len));
      try { r.input.setSelectionRange(p, p); } catch (e) { /* ignorieren */ }
    }

    nextInput(idx) { for (let i = idx + 1; i < this.rows.length; i++) if (this.rows[i].input) return this.rows[i]; return null; }
    prevInput(idx) { for (let i = idx - 1; i >= 0; i--) if (this.rows[i].input) return this.rows[i]; return null; }

    onKey(r, e) {
      if (this.readOnly) return;
      const inp = r.input;
      const idx = this.rows.indexOf(r);
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (this.onSubmit) this.onSubmit(); return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        const target = e.key === 'ArrowUp' ? this.prevInput(idx) : this.nextInput(idx);
        if (target) { e.preventDefault(); this.focusRow(target, inp.selectionStart); }
        return;
      }
      if (r.k === 'i') {
        if (e.key === 'Enter') {
          e.preventDefault();
          const nx = this.nextInput(idx);
          if (nx) this.focusRow(nx, 'end'); else if (this.onSubmit) this.onSubmit();
        }
        return;
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        if (e.shiftKey) {
          const v = inp.value;
          let n = 0;
          while (n < 4 && v[n] === ' ') n++;
          if (n === 0 && v[0] === '\t') n = 1;
          if (n) {
            const a = Math.max(0, inp.selectionStart - n), b = Math.max(0, inp.selectionEnd - n);
            inp.value = v.slice(n);
            inp.setSelectionRange(a, b);
          }
        } else {
          inp.setRangeText('    ', inp.selectionStart, inp.selectionEnd, 'end');
        }
        this.changed(r);
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = inp.value, a = inp.selectionStart, b = inp.selectionEnd;
        const before = v.slice(0, a), after = v.slice(b);
        const next = this.rows[idx + 1];
        if (after === '' && next && next.k === 'e' && next.v === '') {
          if (before !== v) { inp.value = before; this.changed(r); }
          this.focusRow(next, 0);
          return;
        }
        inp.value = before;
        this.changed(r);
        const nr = this.insertAfter(idx, { k: 'e', v: after });
        this.focusRow(nr, 0);
        return;
      }
      if (e.key === 'Backspace' && inp.selectionStart === 0 && inp.selectionEnd === 0) {
        const prev = this.rows[idx - 1];
        if (!prev || prev.k !== 'e') return;
        e.preventDefault();
        const pos = prev.v.length;
        if (r.v !== '') { prev.input.value = prev.v + r.v; this.changed(prev); }
        this.remove(idx);
        this.focusRow(prev, pos);
        return;
      }
      if (e.key === 'Delete' && inp.selectionStart === inp.value.length && inp.selectionEnd === inp.value.length) {
        const next = this.rows[idx + 1];
        if (!next || next.k !== 'e') return;
        e.preventDefault();
        const pos = r.v.length;
        if (next.v !== '') { inp.value = r.v + next.v; this.changed(r); }
        this.remove(idx + 1);
        this.focusRow(r, pos);
      }
    }

    onPaste(r, e) {
      if (this.readOnly) return;
      const cd = e.clipboardData || window.clipboardData;
      const text = cd ? cd.getData('text') : '';
      if (!text) return;
      const norm = text.replace(/\r\n?/g, '\n').replace(/\t/g, '    ');
      const inp = r.input;
      if (r.k === 'i' || !norm.includes('\n')) {
        if (norm === text && !norm.includes('\n')) return;
        e.preventDefault();
        inp.setRangeText(norm.replace(/\n+/g, ' '), inp.selectionStart, inp.selectionEnd, 'end');
        this.changed(r);
        return;
      }
      e.preventDefault();
      const parts = norm.split('\n');
      if (parts.length > 1 && parts[parts.length - 1] === '') parts.pop();
      const a = inp.selectionStart, b = inp.selectionEnd;
      const before = inp.value.slice(0, a), after = inp.value.slice(b);
      inp.value = before + parts[0];
      this.changed(r);
      let idx = this.rows.indexOf(r), last = r;
      for (let k = 1; k < parts.length; k++) {
        const next = this.rows[idx + 1];
        if (next && next.k === 'e' && next.v === '') { next.input.value = parts[k]; this.changed(next); last = next; }
        else last = this.insertAfter(idx, { k: 'e', v: parts[k] });
        idx++;
      }
      if (after) { last.input.value = last.v + after; this.changed(last); }
      this.focusRow(last, last.input.value.length - after.length);
    }

    unmark(r) {
      r.el.classList.remove('err-syn', 'err-sem');
      r.markEl.textContent = '';
      r.el.removeAttribute('title');
    }
    clearMarks() { this.rows.forEach(r => this.unmark(r)); }
    mark(idxs, kind, details) {
      for (const i of idxs) {
        const r = this.rows[i];
        if (!r) continue;
        r.el.classList.add(kind === 'syntax' ? 'err-syn' : 'err-sem');
        r.markEl.textContent = '✗';
        const label = [];
        if (r.el.classList.contains('err-syn')) label.push('Syntaxfehler');
        if (r.el.classList.contains('err-sem')) label.push('Semantikfehler');
        let title = label.join(' und ');
        if (details && details.get(i)) title += ': ' + details.get(i).join('; ');
        r.el.title = title;
      }
    }

    setReadOnly(ro) {
      this.readOnly = ro;
      this.root.classList.toggle('readonly', ro);
      this.rows.forEach(r => { if (r.input) r.input.readOnly = ro; });
    }

    fill(lines) {
      // Musterlösung einsetzen (Zeilen passen 1:1 zum Raster)
      this.rows.forEach(r => r.el.remove());
      this.rows = this.sk.map((r, i) => {
        if (typeof r === 'string') return { k: 'f', i };
        const line = lines[i] || '';
        if (Array.isArray(r)) return { k: 'i', i, v: line.slice(r[0].length, line.length - r[1].length) };
        return { k: 'e', v: line };
      });
      this.rows.forEach(r => this.inner.append(this.makeRow(r)));
      this.renumber();
      if (this.onChange) this.onChange();
    }
  }

  // ------------------------------------------------------------------
  // Fragen (Kontrollfragen und Lese-Aufgaben)
  // ------------------------------------------------------------------
  function checkAnswer(q, v) {
    if (v == null) return false;
    if (q.type === 'choice') return v === q.answer;
    const s = String(v).trim().replace(/\s+/g, '');
    if (!s) return false;
    if (q.type === 'int') return /^[+-]?\d+$/.test(s) && Number(s) === q.answer;
    if (q.type === 'double') {
      const t = s.replace(',', '.');
      return /^[+-]?(\d+\.?\d*|\.\d+)$/.test(t) && Math.abs(Number(t) - q.answer) < 1e-9;
    }
    if (q.type === 'char') return s.replace(/^'(.)'$/, '$1') === q.answer;
    if (q.type === 'boolean') return ['true', 'wahr'].includes(s.toLowerCase()) === q.answer && ['true', 'false', 'wahr', 'falsch'].includes(s.toLowerCase());
    return false;
  }

  function buildQuestions(s, groups, title) {
    const wrap = el('div', { class: 'quiz' });
    if (title) wrap.append(el('h4', { class: 'quiz-title', text: title }));
    const items = [];
    const saved = state.answers[s.id] || {};
    let qi = 0;
    for (const g of groups) {
      const grp = el('div', { class: 'qgroup' });
      if (g.label) grp.append(el('div', { class: 'qlabel', text: g.label }));
      if (g.intro) grp.append(el('div', { class: 'prose', html: g.intro }));
      if (g.code) grp.insertAdjacentHTML('beforeend', codeBlock(g.code));
      for (const q of g.questions) {
        const idx = qi++;
        const id = s.id + '-q' + idx;
        const row = el('div', { class: 'q' + (q.type === 'choice' ? ' q-choice' : '') });
        let get, inputs;
        if (q.type === 'choice') {
          row.append(el('div', { class: 'q-prompt', html: q.prompt }));
          const opts = el('div', { class: 'choices', role: 'radiogroup' });
          q.options.forEach((o, oi) => {
            const rid = id + '-o' + oi;
            const radio = el('input', { type: 'radio', name: id, id: rid, value: String(oi) });
            if (saved[idx] === oi) radio.checked = true;
            opts.append(el('label', { class: 'choice', for: rid }, radio, el('code', { text: o })));
          });
          row.append(opts);
          get = () => { const r = row.querySelector('input:checked'); return r ? Number(r.value) : null; };
          inputs = () => [...row.querySelectorAll('input')];
          row.addEventListener('change', () => { row.classList.remove('ok', 'bad'); });
        } else {
          const inp = el('input', { type: 'text', class: 'answer', id, autocomplete: 'off', spellcheck: 'false' });
          if (saved[idx] != null) inp.value = saved[idx];
          inp.addEventListener('input', () => row.classList.remove('ok', 'bad'));
          inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } });
          row.append(el('label', { class: 'q-prompt', for: id, html: q.prompt }), el('span', { class: 'q-arrow', 'aria-hidden': 'true', text: '→' }), inp);
          get = () => inp.value;
          inputs = () => [inp];
        }
        row.append(el('span', { class: 'q-state', 'aria-hidden': 'true' }));
        grp.append(row);
        items.push({ q, idx, row, get, inputs });
      }
      wrap.append(grp);
    }
    const fb = el('div', { class: 'feedback', role: 'status', 'aria-live': 'polite' });
    const btn = el('button', { class: 'btn primary', type: 'button', text: 'Antworten prüfen' });
    const actions = el('div', { class: 'actions' }, btn);
    wrap.append(actions, fb);
    if (teacher) {
      const sol = el('div', { class: 'teacher-sol', hidden: true });
      sol.innerHTML = '<p><strong>Lösungen:</strong> ' + items.map((it, n) => {
        const a = it.q.type === 'choice' ? '<code>' + esc(it.q.options[it.q.answer]) + '</code>' : '<code>' + esc(it.q.type === 'double' ? String(it.q.answer).replace(/^(\d+)$/, '$1.0') : it.q.answer) + '</code>';
        return (n + 1) + ') ' + a;
      }).join(' · ') + '</p>';
      actions.append(el('button', { class: 'btn ghost', type: 'button', text: 'Lösungen anzeigen', onclick: () => { sol.hidden = !sol.hidden; } }));
      wrap.append(sol);
    }

    btn.addEventListener('click', () => {
      const ans = state.answers[s.id] = state.answers[s.id] || {};
      let nOk = 0, nEmpty = 0;
      for (const it of items) {
        const v = it.get();
        ans[it.idx] = v;
        const empty = v == null || String(v).trim() === '';
        if (empty) nEmpty++;
        const ok = checkAnswer(it.q, v);
        if (ok) nOk++;
        it.row.classList.toggle('ok', ok);
        it.row.classList.toggle('bad', !ok && !empty);
      }
      saveState();
      if (nOk === items.length) {
        solve(s, fb, 'Richtig!');
      } else if (nEmpty === items.length) {
        setFeedback(fb, 'info', 'Gib zuerst eine Antwort ein.');
      } else if (items.length === 1) {
        setFeedback(fb, 'bad', 'Das stimmt leider noch nicht. Versuche es noch einmal.');
      } else {
        setFeedback(fb, 'bad', 'Noch nicht ganz: ' + nOk + ' von ' + items.length + ' Antworten sind richtig.' + (nEmpty ? ' Beantworte alle Fragen.' : ' Die rot markierten stimmen noch nicht.'));
      }
    });
    s.lock = ro => { btn.hidden = ro; items.forEach(it => it.inputs().forEach(i => { i.disabled = ro; })); };
    if (state.solved[s.id]) items.forEach(it => { if (checkAnswer(it.q, it.get())) it.row.classList.add('ok'); });
    return wrap;
  }

  function setFeedback(fb, kind, html) {
    fb.className = 'feedback show ' + kind;
    fb.innerHTML = html;
  }

  // ------------------------------------------------------------------
  // Karten
  // ------------------------------------------------------------------
  function cardTitle(s) {
    if (s.kind === 'explain') return { tag: 'Abschnitt ' + s.num, title: s.data.title, chip: null };
    return { tag: 'Aufgabe ' + s.num, title: s.data.title, chip: s.data.label };
  }

  function createCard(s) {
    const t = cardTitle(s);
    const root = el('article', { class: 'card', id: 'schritt-' + s.id });
    const head = el('header', { class: 'card-head' },
      el('span', { class: 'card-tag', text: t.tag }),
      el('h3', { class: 'card-title', text: t.title }),
      t.chip ? el('span', { class: 'chip ' + (s.kind === 'read' ? 'chip-read' : 'chip-code'), text: t.chip }) : null,
      el('span', { class: 'card-status' }));
    const body = el('div', { class: 'card-body' });
    root.append(head, body);
    s.card = { root, head, body, status: head.querySelector('.card-status') };
    s.built = false;
  }

  function buildBody(s) {
    const body = s.card.body;
    if (s.kind === 'explain') {
      const e = s.data;
      for (const b of e.blocks) {
        if (b[0] === 'html') body.append(el('div', { class: 'prose', html: b[1] }));
        else if (b[0] === 'code') body.insertAdjacentHTML('beforeend', codeBlock(b[1]));
        else if (b[0] === 'box') body.append(el('div', { class: 'box ' + (b[2] || ''), html: b[1] }));
      }
      const n = e.quiz.questions.length;
      body.append(buildQuestions(s, [{ intro: e.quiz.intro, code: e.quiz.code, questions: e.quiz.questions }], n > 1 ? 'Kontrollfragen' : 'Kontrollfrage'));
    } else if (s.kind === 'read') {
      const t = s.data;
      body.append(el('div', { class: 'prose', html: t.text }));
      body.append(buildQuestions(s, t.parts.map(p => ({ label: p.label, code: p.code, questions: p.questions })), null));
    } else {
      buildCodeTask(s);
    }
    s.built = true;
  }

  function buildCodeTask(s) {
    const t = s.data;
    const body = s.card.body;
    body.append(el('div', { class: 'prose', html: t.text }));
    const fb = el('div', { class: 'feedback', role: 'status', 'aria-live': 'polite' });
    const ed = new Editor(t, state.code[t.id], () => { state.code[t.id] = ed.serialize(); saveState(); fb.className = 'feedback'; }, () => check());
    s.editor = ed;
    const btn = el('button', { class: 'btn primary', type: 'button', text: 'Prüfen' });
    const actions = el('div', { class: 'actions' }, btn, el('span', { class: 'hint', html: '<kbd>Strg</kbd> + <kbd>Enter</kbd> prüft ebenfalls' }));
    body.append(ed.root, actions, fb);

    if (teacher) {
      const sol = el('div', { class: 'teacher-sol', hidden: true });
      sol.innerHTML = '<p><strong>Musterlösung</strong> (gleichwertige Lösungen werden ebenfalls als richtig erkannt):</p>' + codeBlock(t.solutions[0]);
      actions.append(
        el('button', { class: 'btn ghost', type: 'button', text: 'Musterlösung anzeigen', onclick: () => { sol.hidden = !sol.hidden; } }),
        el('button', { class: 'btn ghost', type: 'button', text: 'Musterlösung einsetzen', onclick: () => { ed.fill(t.solutions[0].split('\n')); } }));
      body.append(sol);
    }

    function check() {
      if (ed.readOnly) return;
      ed.clearMarks();
      if (ed.allEmpty()) { setFeedback(fb, 'info', 'Du hast noch nichts eingegeben.'); return; }
      let res;
      try { res = J.evaluate(getPrep(t), ed.getLines(), ed.getEditable()); }
      catch (e) { console.error(e); setFeedback(fb, 'bad', 'Beim Prüfen ist ein unerwarteter Fehler aufgetreten.'); return; }
      if (res.empty) { setFeedback(fb, 'info', 'Du hast noch nichts eingegeben.'); return; }
      if (res.solved) { solve(s, fb, 'Richtig! Dein Code ist fehlerfrei.'); return; }
      const syn = [...res.syntax.keys()].sort((a, b) => a - b);
      const sem = res.semantic === 'fail' ? (res.semLines || []) : [];
      ed.mark(syn, 'syntax', teacher ? res.syntax : null);
      ed.mark(sem, 'semantic', null);
      const parts = [];
      if (syn.length) parts.push('<strong>Syntaxfehler</strong> in ' + lineList(syn) + '.');
      if (res.semantic === 'fail') {
        if (sem.length) parts.push('<strong>Semantikfehler</strong> in ' + lineList(sem) + '.');
        else parts.push('<strong>Semantikfehler:</strong> Dein Code liefert nicht für alle Eingaben das richtige Ergebnis. Die Stelle lässt sich keiner einzelnen Zeile zuordnen.');
      }
      let html = '<span class="fb-icon" aria-hidden="true">✗</span> ' + parts.join(' ');
      if (res.semantic === 'skipped') html += '<br><span class="fb-note">Ob dein Code das Richtige tut, wird geprüft, sobald er keine Syntaxfehler mehr enthält.</span>';
      if (teacher && syn.length) {
        html += '<details class="fb-details"><summary>Details (nur im Lehrermodus sichtbar)</summary><ul>' +
          syn.map(l => '<li>Zeile ' + (l + 1) + ': ' + esc(res.syntax.get(l).join('; ')) + '</li>').join('') + '</ul></details>';
      }
      setFeedback(fb, 'bad', html);
    }
    btn.addEventListener('click', check);
    s.lock = ro => { btn.hidden = ro; ed.setReadOnly(ro); };
  }

  // ------------------------------------------------------------------
  // Freischalten, Fortschritt
  // ------------------------------------------------------------------
  const ui = {};

  function solve(s, fb, msg) {
    const wasSolved = !!state.solved[s.id];
    state.solved[s.id] = true;
    saveState(true);
    const idx = steps.indexOf(s);
    const next = steps[idx + 1];
    let html = '<span class="fb-icon" aria-hidden="true">✓</span> ' + msg;
    setFeedback(fb, 'ok', html);
    refresh();
    const allDone = steps.every(x => state.solved[x.id]);
    const target = next ? next.card.root : (allDone ? ui.part3 : null);
    if (target && !wasSolved) {
      const go = el('button', { class: 'btn next', type: 'button', text: next ? (next.kind === 'explain' ? 'Weiter zum nächsten Abschnitt ↓' : (s.kind === 'explain' && next.kind !== 'explain' ? 'Weiter zu den Aufgaben ↓' : 'Weiter zur nächsten Aufgabe ↓')) : 'Weiter zur Abschlussaufgabe ↓' });
      go.addEventListener('click', () => target.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      fb.append(' ', go);
    }
  }

  function setCardState(s, mode) {
    const c = s.card;
    c.root.classList.remove('locked', 'active', 'solved');
    c.root.classList.add(mode);
    if (mode === 'locked') {
      c.status.textContent = '🔒 gesperrt';
      c.body.hidden = true;
      return;
    }
    c.body.hidden = false;
    if (!s.built) buildBody(s);
    c.status.textContent = mode === 'solved' ? '✓ gelöst' : '';
    if (s.lock) s.lock(mode === 'solved' && !teacher);
  }

  function refresh() {
    const firstOpen = steps.findIndex(x => !state.solved[x.id]);
    steps.forEach((x, i) => {
      const unlocked = teacher || firstOpen === -1 || i <= firstOpen;
      setCardState(x, unlocked ? (state.solved[x.id] ? 'solved' : 'active') : 'locked');
    });
    const done = steps.filter(x => state.solved[x.id]).length;
    ui.count.textContent = done + ' / ' + steps.length;
    ui.bar.style.width = (100 * done / steps.length) + '%';
    ui.progress.setAttribute('aria-valuenow', String(done));
    const firstTask = steps.findIndex(x => x.kind !== 'explain');
    const tasksOpen = teacher || firstOpen === -1 || firstOpen >= firstTask;
    ui.help.hidden = !tasksOpen;
    const allDone = firstOpen === -1;
    ui.part3.hidden = !(teacher || allDone);
    ui.congrats.hidden = !allDone;
  }

  // ------------------------------------------------------------------
  // Seite aufbauen
  // ------------------------------------------------------------------
  function buildPage() {
    const m = DATA.meta;
    document.title = m.docTitle;
    const app = document.getElementById('app');
    app.innerHTML = '';

    ui.count = el('span', { class: 'tb-count' });
    ui.bar = el('span', { class: 'tb-fill' });
    ui.progress = el('div', { class: 'tb-bar', role: 'progressbar', 'aria-label': 'Fortschritt', 'aria-valuemin': '0', 'aria-valuemax': String(steps.length) }, ui.bar);
    const topbar = el('div', { class: 'topbar' },
      el('div', { class: 'topbar-in' },
        el('a', { class: 'tb-title', href: '#top', text: m.h1, onclick: e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }),
        teacher ? el('span', { class: 'tb-teacher', text: 'Lehrermodus' }) : null,
        el('div', { class: 'tb-progress' }, ui.progress, ui.count)));

    const hero = el('header', { class: 'hero', id: 'top' },
      el('p', { class: 'kicker', text: m.kicker }),
      el('h1', { text: m.h1 }),
      el('p', { class: 'lead', text: m.lead }));
    if (teacher) hero.append(el('p', { class: 'teacher-note', html: '<strong>Lehrermodus:</strong> Alle Abschnitte sind freigeschaltet, Musterlösungen lassen sich einblenden. Der Fortschritt wird in diesem Modus nicht gespeichert.' }));

    const part1 = el('section', { class: 'part' }, el('h2', { class: 'part-title', html: '<span>Teil 1</span> Erklärungen und Kontrollfragen' }));
    const part2 = el('section', { class: 'part' }, el('h2', { class: 'part-title', html: '<span>Teil 2</span> Übungsaufgaben' }));
    ui.help = el('div', { class: 'box help', html: DATA.editorHelp });
    part2.append(ui.help);
    for (const s of steps) {
      createCard(s);
      (s.kind === 'explain' ? part1 : part2).append(s.card.root);
    }

    const f = DATA.finalTask;
    ui.part3 = el('section', { class: 'part', id: 'abschluss' }, el('h2', { class: 'part-title', html: '<span>Teil 3</span> Abschlussaufgabe' }));
    ui.congrats = el('div', { class: 'congrats', html: '<span aria-hidden="true">🎉</span> Stark! Du hast alle Aufgaben auf dieser Seite gelöst. Jetzt wartet noch eine letzte Aufgabe auf dich – diesmal in Greenfoot.' });
    const tip = el('div', { class: 'box tip', hidden: true, html: '<p class="box-title">Tipp</p>' + f.tip });
    const tipBtn = el('button', { class: 'btn ghost', type: 'button', text: 'Tipp anzeigen', onclick: () => { tip.hidden = !tip.hidden; tipBtn.textContent = tip.hidden ? 'Tipp anzeigen' : 'Tipp ausblenden'; } });
    ui.part3.append(ui.congrats, el('article', { class: 'card final' },
      el('header', { class: 'card-head' }, el('span', { class: 'card-tag', text: 'Abschluss' }), el('h3', { class: 'card-title', text: f.title })),
      el('div', { class: 'card-body' }, el('div', { class: 'prose', html: f.html }), el('div', { class: 'actions' }, tipBtn), tip)));

    const resetBtn = el('button', { class: 'btn ghost small', type: 'button', text: 'Von vorne beginnen' });
    resetBtn.addEventListener('click', () => {
      if (!window.confirm('Willst du wirklich von vorne beginnen? Dein gesamter Fortschritt auf dieser Seite wird gelöscht.')) return;
      resetting = true;
      clearTimeout(saveTimer);
      try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignorieren */ }
      location.reload();
    });
    const footer = el('footer', { class: 'footer' },
      el('p', { text: teacher ? 'Lehrermodus: Der Fortschritt wird nicht gespeichert.' : (storageOk ? 'Dein Fortschritt wird in diesem Browser auf diesem Gerät gespeichert.' : 'Hinweis: In diesem Browser kann dein Fortschritt nicht gespeichert werden.') }),
      teacher ? null : resetBtn);

    app.append(topbar, el('main', { class: 'wrap' }, hero, part1, part2, ui.part3), footer);
    refresh();
    // Nach dem Neuladen direkt zum aktuellen Schritt springen
    const firstOpen = steps.findIndex(x => !state.solved[x.id]);
    if (!teacher && !location.hash && firstOpen > 0) {
      requestAnimationFrame(() => steps[firstOpen].card.root.scrollIntoView({ block: 'start' }));
    }
  }

  buildPage();
})();

</script>
</body>
</html>
